<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Afterimage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-live="polite">
    <header><p class="eyebrow">病例 07／觀察紀錄</p><h1>AFTERIMAGE</h1><p id="day">第 0 天・清晨</p></header>
    <section class="scene" id="scene">
      <p class="hint">你今天第一個看見的臉，會留下來。</p>
      <div class="face calm" id="face" aria-hidden="true"><span class="eye left"></span><span class="eye right"></span><span class="mouth"></span></div>
      <p class="description" id="description">請選擇你醒來時望向的方向。</p><div class="choices" id="choices"></div>
    </section>
    <footer><span id="status">臉不是證詞。</span><button id="restart" hidden>重新醒來</button></footer>
  </main><script src="game.js"></script>
</body>
</html>
